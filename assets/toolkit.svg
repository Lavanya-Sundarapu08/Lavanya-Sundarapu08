  <style>
    .cat-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #58a6ff; text-transform: uppercase; letter-spacing: 0.8px; }
    .skill-pill { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 6px; }
    .skill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 500; fill: #e6edf3; }
    .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; fill: #f0f6fc; }

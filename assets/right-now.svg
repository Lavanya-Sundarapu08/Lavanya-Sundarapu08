<svg width="840" height="210" viewBox="0 0 840 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="rnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
  </defs>

  <style>
    .terminal-header { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #58a6ff; letter-spacing: 1px; }
    .status-badge { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .project-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #f0f6fc; }
    .project-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #8b949e; }
  </style>

  <!-- Background Card -->
  <rect width="840" height="210" rx="14" fill="url(#rnBg)"/>
  <rect x="0.5" y="0.5" width="839" height="209" rx="13.5" stroke="url(#rnBorder)"/>

  <!-- Top Terminal Bar -->
  <circle cx="32" cy="24" r="5" fill="#f85149" fill-opacity="0.8"/>
  <circle cx="48" cy="24" r="5" fill="#e3b341" fill-opacity="0.8"/>
  <circle cx="64" cy="24" r="5" fill="#3fb950" fill-opacity="0.8"/>
  <text x="88" y="28" class="terminal-header">lavanya@portfolio:~/right-now</text>
  <line x1="20" y1="42" x2="820" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- Row 1: Building -->
  <g transform="translate(30, 60)">
    <rect width="80" height="22" rx="6" fill="#238636" fill-opacity="0.2" stroke="#2ea043" stroke-width="0.8"/>
    <text x="40" y="15" text-anchor="middle" class="status-badge" fill="#3fb950">BUILDING</text>
    <text x="95" y="16" class="project-title">Smart Expense Tracker</text>
    <text x="260" y="16" class="project-desc">— Recurring finance engine with analytics &amp; automated budget alerts</text>
  </g>

  <!-- Row 2: Learning -->
  <g transform="translate(30, 105)">
    <rect width="80" height="22" rx="6" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="0.8"/>
    <text x="40" y="15" text-anchor="middle" class="status-badge" fill="#58a6ff">LEARNING</text>
    <text x="95" y="16" class="project-title">Enterprise Java &amp; DP</text>
    <text x="250" y="16" class="project-desc">— Advanced Spring Boot microservice architectures &amp; Dynamic Programming</text>
  </g>

  <!-- Row 3: Reading -->
  <g transform="translate(30, 150)">
    <rect width="80" height="22" rx="6" fill="#8957e5" fill-opacity="0.2" stroke="#a371f7" stroke-width="0.8"/>
    <text x="40" y="15" text-anchor="middle" class="status-badge" fill="#bc8cff">EXPLORING</text>
    <text x="95" y="16" class="project-title">System Design &amp; DSA</text>
    <text x="255" y="16" class="project-desc">— High-volume distributed system design patterns &amp; competitive programming</text>
  </g>
</svg>

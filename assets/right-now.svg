<svg width="800" height="205" viewBox="0 0 800 205" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #38bdf8; text-transform: uppercase; letter-spacing: 1.2px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #e2e8f0; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .dot-build { fill: #10b981; }
    .dot-learn { fill: #6366f1; }
    .dot-read { fill: #f59e0b; }
  </style>

  <!-- Background Card -->
  <rect width="800" height="205" rx="12" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="799" height="204" rx="11.5" stroke="url(#borderGrad)"/>

  <!-- Title -->
  <text x="40" y="40" class="header">⚡ Right Now</text>

  <!-- Item 1: Building -->
  <circle cx="48" cy="74" r="5" class="dot-build"/>
  <text x="65" y="78" class="label">Building:</text>
  <text x="135" y="78" class="desc">Smart Expense Tracker — personal finance engine with recurring payments and analytics</text>

  <!-- Item 2: Learning -->
  <circle cx="48" cy="116" r="5" class="dot-learn"/>
  <text x="65" y="120" class="label">Learning:</text>
  <text x="138" y="120" class="desc">Advanced Java, Spring Boot Microservices architecture &amp; Dynamic Programming</text>

  <!-- Item 3: Reading -->
  <circle cx="48" cy="158" r="5" class="dot-read"/>
  <text x="65" y="162" class="label">Reading:</text>
  <text x="135" y="162" class="desc">Data Structures &amp; Algorithms paradigms and Java enterprise design patterns</text>
</svg>

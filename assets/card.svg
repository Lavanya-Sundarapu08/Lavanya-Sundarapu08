<svg width="840" height="230" viewBox="0 0 840 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b28"/>
      <stop offset="50%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="30%" stop-color="#7928ca"/>
      <stop offset="70%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#00dfd8"/>
    </linearGradient>
    <linearGradient id="xpBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 800; fill: #f0f6fc; text-transform: uppercase; letter-spacing: 1.5px; }
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
    .hero-role { font-family: 'SF Mono', Consolas, monospace; font-size: 12px; font-weight: 600; fill: #79c0ff; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #e6edf3; }
    .stat-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8b949e; }
  </style>

  <!-- Holographic Border & Background -->
  <rect width="840" height="230" rx="14" fill="url(#cardHolo)"/>
  <rect x="1" y="1" width="838" height="228" rx="13" stroke="url(#holoBorder)" stroke-width="1.8"/>

  <!-- Card Top Banner -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="card-title">🎴 DEVELOPER TRADING CARD</text>
    <rect x="650" y="-14" width="125" height="22" rx="11" fill="#7928ca" fill-opacity="0.3" stroke="#a855f7" stroke-width="0.8"/>
    <text x="712" y="1" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#d8b4fe">EDITION: 2026 // BUILDER</text>
  </g>
  <line x1="20" y1="44" x2="820" y2="44" stroke="#21262d" stroke-width="1"/>

  <!-- Character Header -->
  <g transform="translate(32, 68)">
    <text x="0" y="0" class="hero-name">Lavanya Sundarapu</text>
    <text x="215" y="-1" class="hero-role">[ CLASS: Java Full Stack Engineer // LEVEL: Fresher ]</text>
  </g>

  <!-- Trait 1: LeetCode -->
  <g transform="translate(32, 92)">
    <circle cx="8" cy="8" r="4.5" fill="#ffa116"/>
    <text x="22" y="12" class="stat-label">320+ LeetCode Problems Cleared</text>
    <text x="250" y="12" class="stat-desc">— High proficiency in Arrays, Strings, Trees, Graphs &amp; Dynamic Programming</text>
  </g>

  <!-- Trait 2: Hackathon -->
  <g transform="translate(32, 126)">
    <circle cx="8" cy="8" r="4.5" fill="#a855f7"/>
    <text x="22" y="12" class="stat-label">Regional Hackathon Champion</text>
    <text x="240" y="12" class="stat-desc">— Designed &amp; delivered full-stack production prototype under strict 24-hr deadline</text>
  </g>

  <!-- Trait 3: Free Fire -->
  <g transform="translate(32, 160)">
    <circle cx="8" cy="8" r="4.5" fill="#00dfd8"/>
    <text x="22" y="12" class="stat-label">Garena Free Fire Strategist</text>
    <text x="220" y="12" class="stat-desc">— Fast tactical coordination, rapid reflex decision-making, and high team synergy</text>
  </g>
</svg>

<svg width="840" height="380" viewBox="0 0 840 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardHoloBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f17"/>
      <stop offset="35%" stop-color="#141926"/>
      <stop offset="70%" stop-color="#111520"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Holographic Outer Border Gradient -->
    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Stat Bar Gradients -->
    <linearGradient id="dsaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="mindGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Shiny Badge Gradient -->
    <linearGradient id="rarityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <style>
    .card-top-tag { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #94a3b8; letter-spacing: 2px; }
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 900; fill: #ffffff; letter-spacing: -0.5px; }
    .hero-class { font-family: 'SF Mono', Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #38bdf8; }
    .section-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 800; fill: #818cf8; text-transform: uppercase; letter-spacing: 1px; }
    .stat-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; font-weight: 600; fill: #e2e8f0; }
    .stat-val { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #f8fafc; }
    .trait-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #f1f5f9; }
    .trait-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #94a3b8; }
    .quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; font-style: italic; fill: #64748b; }
    .bar-bg { fill: #1e293b; rx: 4px; }
  </style>

  <!-- Card Body -->
  <rect width="840" height="380" rx="16" fill="url(#cardHoloBg)"/>
  <rect x="1.5" y="1.5" width="837" height="377" rx="14.5" stroke="url(#holoBorder)" stroke-width="2"/>

  <!-- Top Status Bar -->
  <g transform="translate(35, 32)">
    <text x="0" y="0" class="card-top-tag">PLAYER CARD // EDITION 2026</text>
    
    <!-- Rarity Capsule -->
    <rect x="585" y="-15" width="185" height="24" rx="12" fill="url(#rarityGrad)" fill-opacity="0.25" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1"/>
    <text x="677" y="1" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#fecdd3" letter-spacing="1px">★ MYTHIC • BUILDER ★</text>
  </g>

  <line x1="25" y1="46" x2="815" y2="46" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Character Header with Sigil -->
  <g transform="translate(35, 78)">
    <!-- Sigil Shield -->
    <rect width="52" height="52" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="26" y="34" font-size="24" text-anchor="middle">⚡</text>

    <!-- Name & Subtitle -->
    <text x="68" y="24" class="hero-name">Lavanya Sundarapu</text>
    <text x="68" y="44" class="hero-class">Class: Java Full Stack Developer • Specialization: Spring Boot &amp; AI</text>
  </g>

  <!-- Left Column: Combat & Skill Attributes -->
  <g transform="translate(35, 160)">
    <text x="0" y="0" class="section-title">📊 Core Attribute Ratings</text>

    <!-- Stat 1: DSA -->
    <g transform="translate(0, 18)">
      <text x="0" y="11" class="stat-name">DSA &amp; Problem Solving (320+ Solved)</text>
      <text x="330" y="11" text-anchor="end" class="stat-val">93 / 100</text>
      <rect y="18" width="330" height="7" class="bar-bg"/>
      <rect y="18" width="307" height="7" rx="3.5" fill="url(#dsaGrad)"/>
    </g>

    <!-- Stat 2: Backend -->
    <g transform="translate(0, 56)">
      <text x="0" y="11" class="stat-name">Java &amp; Spring Boot Architecture</text>
      <text x="330" y="11" text-anchor="end" class="stat-val">90 / 100</text>
      <rect y="18" width="330" height="7" class="bar-bg"/>
      <rect y="18" width="297" height="7" rx="3.5" fill="url(#backendGrad)"/>
    </g>

    <!-- Stat 3: Frontend & UI -->
    <g transform="translate(0, 94)">
      <text x="0" y="11" class="stat-name">React.js &amp; Responsive UI</text>
      <text x="330" y="11" text-anchor="end" class="stat-val">84 / 100</text>
      <rect y="18" width="330" height="7" class="bar-bg"/>
      <rect y="18" width="277" height="7" rx="3.5" fill="url(#frontendGrad)"/>
    </g>

    <!-- Stat 4: Strategic Thinking -->
    <g transform="translate(0, 132)">
      <text x="0" y="11" class="stat-name">Tactical Foresight &amp; System Design</text>
      <text x="330" y="11" text-anchor="end" class="stat-val">89 / 100</text>
      <rect y="18" width="330" height="7" class="bar-bg"/>
      <rect y="18" width="293" height="7" rx="3.5" fill="url(#mindGrad)"/>
    </g>
  </g>

  <!-- Divider Line Between Columns -->
  <line x1="410" y1="160" x2="410" y2="325" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Right Column: Special Perks & Passives -->
  <g transform="translate(435, 160)">
    <text x="0" y="0" class="section-title">✨ Equipped Perks &amp; Passives</text>

    <!-- Trait 1: Hackathon -->
    <g transform="translate(0, 16)">
      <rect width="28" height="28" rx="7" fill="#7c3aed" fill-opacity="0.2" stroke="#a855f7" stroke-width="0.8"/>
      <text x="14" y="19" font-size="14" text-anchor="middle">🏆</text>
      <text x="38" y="13" class="trait-title">Regional Hackathon Champion</text>
      <text x="38" y="27" class="trait-desc">Engineered full-stack winner prototype under a 24-hr clock.</text>
    </g>

    <!-- Trait 2: Chess -->
    <g transform="translate(0, 56)">
      <rect width="28" height="28" rx="7" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="14" y="19" font-size="14" text-anchor="middle">♟️</text>
      <text x="38" y="13" class="trait-title">Chess Strategist</text>
      <text x="38" y="27" class="trait-desc">Anticipates branches, evaluates trade-offs, and thinks 5 moves ahead.</text>
    </g>

    <!-- Trait 3: Painting -->
    <g transform="translate(0, 96)">
      <rect width="28" height="28" rx="7" fill="#db2777" fill-opacity="0.2" stroke="#f472b6" stroke-width="0.8"/>
      <text x="14" y="19" font-size="14" text-anchor="middle">🎨</text>
      <text x="38" y="13" class="trait-title">Canvas Painter</text>
      <text x="38" y="27" class="trait-desc">Brings high visual aesthetic, precision, and harmony to software design.</text>
    </g>

    <!-- Trait 4: AI Catalyst -->
    <g transform="translate(0, 136)">
      <rect width="28" height="28" rx="7" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="0.8"/>
      <text x="14" y="19" font-size="14" text-anchor="middle">⚡</text>
      <text x="38" y="13" class="trait-title">AI-Assisted Velocity</text>
      <text x="38" y="27" class="trait-desc">Accelerates development cycles via advanced prompt workflows.</text>
    </g>
  </g>

  <!-- Bottom Quote Bar -->
  <line x1="25" y1="345" x2="815" y2="345" stroke="#1e293b" stroke-width="1"/>
  <text x="420" y="364" text-anchor="middle" class="quote">"Crafting high-performance backends with Java &amp; Spring Boot — designed with tactical foresight, tested with precision."</text>
</svg>

<svg width="840" height="230" viewBox="0 0 840 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    .section-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #58a6ff; text-transform: uppercase; letter-spacing: 1.2px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #f0f6fc; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #8b949e; }
    .quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #7d8590; font-style: italic; }
  </style>

  <!-- Background Card (Clean GitHub Dark Theme) -->
  <rect width="840" height="230" rx="10" fill="url(#cardBg)"/>
  <rect x="0.5" y="0.5" width="839" height="229" rx="9.5" stroke="#30363d"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="section-tag">Highlights &amp; Interests</text>
    <text x="0" y="24" class="card-title">Lavanya Sundarapu • Java Full Stack Developer</text>
  </g>

  <line x1="20" y1="68" x2="820" y2="68" stroke="#21262d" stroke-width="1"/>

  <!-- Item 1: LeetCode -->
  <g transform="translate(32, 92)">
    <circle cx="6" cy="6" r="3.5" fill="#f0883e"/>
    <text x="20" y="10" class="item-title">Problem Solving:</text>
    <text x="140" y="10" class="item-desc">Solved 320+ LeetCode problems with a focus on core Data Structures, Algorithms &amp; Java fundamentals.</text>
  </g>

  <!-- Item 2: Hackathon -->
  <g transform="translate(32, 126)">
    <circle cx="6" cy="6" r="3.5" fill="#bc8cff"/>
    <text x="20" y="10" class="item-title">Hackathon:</text>
    <text x="105" y="10" class="item-desc">Regional-level hackathon winner — collaborated under time constraints to deliver a working prototype.</text>
  </g>

  <!-- Item 3: Chess & Painting -->
  <g transform="translate(32, 160)">
    <circle cx="6" cy="6" r="3.5" fill="#3fb950"/>
    <text x="20" y="10" class="item-title">Beyond Tech:</text>
    <text x="115" y="10" class="item-desc">Intermediate chess player and painter enjoying strategic board games and art in spare time.</text>
  </g>

  <!-- Footer note -->
  <line x1="20" y1="188" x2="820" y2="188" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="208" class="quote">Focus: Building reliable, well-tested full-stack applications with clean code principles.</text>
</svg>

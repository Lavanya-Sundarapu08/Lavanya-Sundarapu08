  </g>

  <!-- Content -->
  <text x="32" y="66" class="sh-pitch">Looking for Full-Time Java Full Stack, Spring Boot &amp; Backend Developer roles.</text>
  <text x="32" y="88" class="sh-sub">Feel free to reach out for opportunities, discussions, or collaborative projects.</text>

  <!-- Channels row -->
  <g transform="translate(32, 114)">
    <text x="0" y="0" class="sh-link">📧 lavanyadevika1122@gmail.com  •  💼 linkedin.com/in/lavanya-sundarapu  •  🐙 github.com/Lavanya-Sundarapu08</text>
  </g>

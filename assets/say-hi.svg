<svg width="840" height="140" viewBox="0 0 840 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    .sh-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #3fb950; text-transform: uppercase; letter-spacing: 1px; }
    .sh-pitch { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .sh-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #8b949e; }
    .sh-link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #58a6ff; }
  </style>

  <!-- Background Card -->
  <rect width="840" height="140" rx="10" fill="url(#shBg)"/>
  <rect x="0.5" y="0.5" width="839" height="139" rx="9.5" stroke="#30363d"/>

  <!-- Left Accent Line -->
  <rect x="0" y="20" width="4" height="100" rx="2" fill="#3fb950"/>

  <!-- Pulse Status Indicator -->
  <g transform="translate(32, 26)">
    <circle cx="6" cy="6" r="4" fill="#3fb950"/>

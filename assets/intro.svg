<svg width="840" height="190" viewBox="0 0 840 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #f0f6fc; }
    .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 600; fill: #58a6ff; }
    .pitch { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
    .pill-bg { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 6px; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; }
  </style>

  <!-- Background Card -->
  <rect width="840" height="190" rx="10" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="839" height="189" rx="9.5" stroke="#30363d"/>

  <!-- Left Accent Line -->
  <rect x="0" y="24" width="4" height="142" rx="2" fill="#58a6ff"/>

  <!-- Headings -->
  <g transform="translate(36, 34)">
    <text x="0" y="22" class="name">Hi there, I'm Lavanya Sundarapu 👋</text>
    <text x="0" y="48" class="role">Java Full Stack Developer • Spring Boot &amp; React</text>
    <text x="0" y="74" class="pitch">Building full-stack applications with Java, Spring Boot, and AI-assisted developer workflows.</text>
  </g>

  <!-- Clean Pills Strip -->
  <g transform="translate(36, 134)">
    <!-- Pill 1 -->
    <rect width="120" height="26" class="pill-bg"/>
    <circle cx="14" cy="13" r="3" fill="#3fb950"/>
    <text x="24" y="17" class="pill-text" fill="#e6edf3">Java &amp; Spring Boot</text>

    <!-- Pill 2 -->
    <g transform="translate(130, 0)">
      <rect width="100" height="26" class="pill-bg"/>
      <circle cx="14" cy="13" r="3" fill="#58a6ff"/>
      <text x="24" y="17" class="pill-text" fill="#e6edf3">React Frontend</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(240, 0)">
      <rect width="130" height="26" class="pill-bg"/>
      <circle cx="14" cy="13" r="3" fill="#f0883e"/>
      <text x="24" y="17" class="pill-text" fill="#e6edf3">320+ LeetCode Solved</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(380, 0)">
      <rect width="115" height="26" class="pill-bg"/>
      <circle cx="14" cy="13" r="3" fill="#bc8cff"/>
      <text x="24" y="17" class="pill-text" fill="#e6edf3">Docker &amp; REST APIs</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(505, 0)">
      <rect width="125" height="26" class="pill-bg"/>
      <circle cx="14" cy="13" r="3" fill="#39c5bb"/>
      <text x="24" y="17" class="pill-text" fill="#e6edf3">AI-Assisted Coding</text>
    </g>
  </g>
</svg>

<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #e2e8f0; }
    .pitch { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Background Card -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="799" height="199" rx="11.5" stroke="#334155" stroke-opacity="0.8"/>

  <!-- Decorative Corner Glow -->
  <circle cx="750" cy="40" r="120" fill="#38bdf8" fill-opacity="0.06"/>
  <circle cx="50" cy="160" r="90" fill="#818cf8" fill-opacity="0.06"/>

  <!-- Content -->
  <text x="40" y="55" class="title">Hi there, I'm Lavanya Sundarapu 👋</text>
  <text x="40" y="88" class="subtitle">Java Full Stack Developer | Backend &amp; Spring Boot Specialist</text>
  <text x="40" y="116" class="pitch">Building scalable full-stack applications with Java, Spring Boot, and AI-assisted workflows.</text>

  <!-- Badges -->
  <g transform="translate(40, 142)">
    <!-- Badge 1 -->
    <rect width="130" height="26" rx="13" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="65" y="17" text-anchor="middle" class="badge-text">☕ Java &amp; Spring Boot</text>

    <!-- Badge 2 -->
    <g transform="translate(142, 0)">
      <rect width="115" height="26" rx="13" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="57" y="17" text-anchor="middle" class="badge-text">⚛️ React Frontend</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(269, 0)">
      <rect width="135" height="26" rx="13" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="67" y="17" text-anchor="middle" class="badge-text">🧩 320+ LeetCode</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(416, 0)">
      <rect width="145" height="26" rx="13" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="72" y="17" text-anchor="middle" class="badge-text">🤖 AI-Assisted Dev</text>
    </g>
  </g>
</svg>
